name: Issue intake

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue
            const { owner, repo } = context.repo
            const labels = issue.labels.map((l) => l.name)
            const types = ['bug', 'enhancement', 'question']
            const hasType = types.some((t) => labels.includes(t))
            const body = (issue.body || '').trim()
            const comment = (text) => github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: text })
            // An empty issue carries nothing to triage: close it and point at the forms.
            if (body.length < 20 && !hasType) {
              await comment('此 issue 没有内容，已关闭。请通过 issue 表单提交并填全必填项。\n\nEmpty issue closed. Please use one of the issue forms and fill the required fields.')
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'not_planned' })
              return
            }
            const parts = []
            // Filed outside the forms: guide softly, do not close a report that has content.
            if (!hasType) {
              parts.push('此 issue 未使用表单提交。请改用「错误反馈 / 建议 / 疑问」表单，以便自动分类并填全复现所需信息。\n\nThis issue was not filed through a form. Please use the Bug / Feature / Question form so it is classified and carries the information needed to reproduce.')
              try { await github.rest.issues.getLabel({ owner, repo, name: 'needs-info' }) }
              catch { try { await github.rest.issues.createLabel({ owner, repo, name: 'needs-info', color: 'fbca04', description: 'Further information is requested' }) } catch {} }
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['needs-info'] })
            }
            // A hint at possibly related open issues, never a gate.
            const core = issue.title.replace(/^\[[^\]]*\]\s*/, '').trim()
            if (core.length >= 4) {
              const found = await github.rest.search.issuesAndPullRequests({ q: `repo:${owner}/${repo} is:issue is:open in:title ${core}`, per_page: 6 })
              const dups = found.data.items.filter((i) => i.number !== issue.number && !i.pull_request)
              if (dups.length) parts.push('可能相关的已有 issue / Possibly related:\n' + dups.map((i) => `- #${i.number} ${i.title}`).join('\n'))
            }
            // For bugs, name the latest release so a stale report is easy to spot.
            if (labels.includes('bug')) {
              try {
                const rel = await github.rest.repos.getLatestRelease({ owner, repo })
                parts.push(`当前最新发布为 ${rel.data.tag_name}。请确认问题在该版本仍存在；若已修复，欢迎关闭。\n\nThe latest release is ${rel.data.tag_name}. Please confirm the issue persists there; close it if already fixed.`)
              } catch {}
            }
            if (parts.length) await comment(parts.join('\n\n---\n\n'))
