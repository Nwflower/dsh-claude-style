name: Issue intake

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue
            const { owner, repo } = context.repo
            const labels = issue.labels.map((l) => l.name)
            const types = ['bug', 'enhancement', 'question']
            const hasType = types.some((t) => labels.includes(t))
            const body = (issue.body || '').trim()
            const comment = (text) => github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: text })
            // Conformance is the form's own type label plus substantive content.
            // Anything else is closed and asked to resubmit through a form.
            if (!hasType || body.length < 20) {
              await comment(`此 issue 未通过规定的 issue 表单提交，或缺少必填内容，已自动关闭。请改用以下表单之一重新提交，并填全必填项：\n\n- **错误反馈 / Bug report**：DSH 版本、插件版本、系统与浏览器、部署方式、同时启用的其他插件、明暗主题、复现步骤、期望与实际，并确认已在最新版本复现。\n- **建议 / Feature request**：场景与动机、期望行为。\n- **疑问 / Question**：想达成什么、已查阅与尝试。\n\n合格的 issue 会被自动分类并进入分诊。\n\n---\n\nThis issue was not submitted through the required issue forms, or lacks required content, and was closed automatically. Please resubmit using one of the forms below with every required field:\n\n- **Bug report**: DSH version, plugin version, OS/browser, deployment, other plugins, light/dark theme, steps, expected vs actual, and a latest-release check.\n- **Feature request**: problem and scenario, proposed behavior.\n- **Question**: what you are trying to do, what you have read and tried.\n\nA conforming issue is classified automatically and enters triage.`)
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'not_planned' })
              return
            }
            const parts = []
            // A hint at possibly related open issues, never a gate.
            const core = issue.title.replace(/^\[[^\]]*\]\s*/, '').trim()
            if (core.length >= 4) {
              const found = await github.rest.search.issuesAndPullRequests({ q: `repo:${owner}/${repo} is:issue is:open in:title ${core}`, per_page: 6 })
              const dups = found.data.items.filter((i) => i.number !== issue.number && !i.pull_request)
              if (dups.length) parts.push('可能相关的已有 issue / Possibly related:\n' + dups.map((i) => `- #${i.number} ${i.title}`).join('\n'))
            }
            // For bugs, name the latest release so a stale report is easy to spot.
            if (labels.includes('bug')) {
              try {
                const rel = await github.rest.repos.getLatestRelease({ owner, repo })
                parts.push(`当前最新发布为 ${rel.data.tag_name}。请确认问题在该版本仍存在；若已修复，欢迎关闭。\n\nThe latest release is ${rel.data.tag_name}. Please confirm the issue persists there; close it if already fixed.`)
              } catch {}
            }
            if (parts.length) await comment(parts.join('\n\n---\n\n'))
