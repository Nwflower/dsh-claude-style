name: Observe

# Observe feature-only master pushes with the full quick smoke and all
# behaviour specs, outside the branch rule; CI already covers shared-layer
# pushes (D92).
#
# Manual runs cover the whole tree. `scripts/ci/ci-scope.mjs` supplies the
# code/selection gate and tree-keyed build cache.
#
# Build must succeed before smoke or behaviour; `!cancelled()` lets them run
# independently. The summary annotates failures without changing the verdict.
#
# Concurrency is per event and commit, with no cancellation so every push keeps
# its own result.
on:
  push:
    branches: [master]
    # Data-only commits are validated by Data and read by no page.
    paths-ignore:
      - 'packages/host/data/**'
  workflow_dispatch:

concurrency:
  group: Observe-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      selection: ${{ steps.scope.outputs.selection }}
      tree: ${{ steps.scope.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The diff reads the commit this push came from.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The scope reads the feature manifests, which esbuild bundles (D42).
      - run: npm ci
      - id: scope
        run: node scripts/ci/ci-scope.mjs --base "${{ github.event.before || 'origin/master' }}"

  observe:
    needs: changed
    # Manual runs always observe; pushes observe only code changes for which CI
    # selected specific features.
    if: github.event_name == 'workflow_dispatch' || (needs.changed.outputs.code == 'true' && needs.changed.outputs.selection != '')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .debug/cache/build
          key: build-cache-${{ runner.os }}-${{ needs.changed.outputs.tree }}
      - id: build
        run: npm run build
        timeout-minutes: 15
      # Run the full quick tier and every behaviour spec, not CI's feature selection.
      - id: stand-in
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node packages/testing/stand-in.mjs --quick
        timeout-minutes: 45
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: observe-behaviour
          path: .debug/runs/behaviour
          if-no-files-found: ignore
      - name: Report what failed
        if: always()
        timeout-minutes: 5
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          STAND_IN_OUTCOME: ${{ steps['stand-in'].outcome }}
        run: node scripts/ci/observe-summary.mjs
