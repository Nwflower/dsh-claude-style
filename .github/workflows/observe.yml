name: Observe

# A push to master is judged in `.github/workflows/ci.yml` by the checks, the
# build, the spec lane and the part of the smoke and the behaviour lane its
# change reaches (D86). A push held inside feature directories walks only those
# directories there, so what it did to the rest of the page is observed here, on
# the same push, through the smoke's quick tier and every behaviour spec, without
# joining the branch rule. A push whose change reached the shared layer already
# walked those two in CI's own verdict, and this workflow leaves it alone.
# Nothing about a pull request, a merge-queue entry or the release matrix
# changes: this workflow answers a push or a manual run, it is not the
# `required` check, and the whole matrix still runs before a version is cut.
#
# `scripts/ci-scope.mjs` answers the three questions the job needs, the way it
# does for CI: `code` is false for a push holding only documents, locale files
# or this workflow, so the page lane is skipped; `selection` is empty for a push
# CI already walked whole; `tree` keys the build cache, so a run over a tree
# another lane already built restores its slow pure steps
# (`scripts/build-cache.mjs`). A manual run judges the whole tree whatever its
# diff against master would say.
#
# The build, the smoke and the behaviour lane are separate steps: the smoke and
# the behaviour lane each wait on the build through `!cancelled()`, so both run
# once the build succeeded, neither waits on the other, and a build that failed
# or was cancelled starts neither. `scripts/observe-summary.mjs` then reads the
# behaviour lane's report into the job summary, one annotation per failing test,
# and names the step log for a failure that left no report; the step's own
# outcome keeps the job red, so the summary adds a reading rather than a verdict.
#
# One concurrency group per event and commit, and nothing is cancelled: every
# push keeps its own verdict, because a newer push is no evidence about the tree
# an older one reported on, and a push and a manual run on one commit are
# different events that both finish.
on:
  push:
    branches: [master]
    # The daily data refresh writes only these files; its own workflow validates
    # them, and no page reads them.
    paths-ignore:
      - 'packages/host/data/**'
  workflow_dispatch:

concurrency:
  group: Observe-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      selection: ${{ steps.scope.outputs.selection }}
      tree: ${{ steps.scope.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The diff reads the commit this push came from.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The scope reads the feature manifests, which esbuild bundles (D42).
      - run: npm ci
      - id: scope
        run: node scripts/ci-scope.mjs --base "${{ github.event.before || 'origin/master' }}"

  observe:
    needs: changed
    # A manual run is asked for on purpose and observes even when its commit
    # differs from master in nothing the page reads; a push observes only when
    # its diff holds code and CI walked a feature selection.
    if: github.event_name == 'workflow_dispatch' || (needs.changed.outputs.code == 'true' && needs.changed.outputs.selection != '')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .debug/build-cache
          key: build-cache-${{ runner.os }}-${{ needs.changed.outputs.tree }}
      - id: build
        run: npm run build
        timeout-minutes: 15
      # The whole quick tier: the observation answers what master looks like, and
      # a selection would only repeat what the push's own scope already judged.
      # `!cancelled()` keeps GitHub's implicit success() out of the condition: a
      # red smoke must not take the behaviour lane down with it.
      - id: smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node packages/testing/smoke.mjs --quick
        timeout-minutes: 30
      - id: behaviour
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run behaviour
        timeout-minutes: 15
      # The report and every failing test's trace, screenshot and markup.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: observe-behaviour
          path: .debug/behaviour
          if-no-files-found: ignore
      - name: Report what failed
        if: always()
        timeout-minutes: 5
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          BEHAVIOUR_OUTCOME: ${{ steps.behaviour.outcome }}
        run: node scripts/observe-summary.mjs
