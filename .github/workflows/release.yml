name: Release

# Require a green manual CI matrix on the tagged commit before packing or
# publishing (D87).
#
# Pack once, publish dev, recheck the tree, then promote the same tarball to
# latest; dist carries npm's files for build-free git installs (D47).

on:
  push:
    tags: ['v*']

# contents: the dist branch, the moved tag and the GitHub Release (D47).
# actions: the matrix verdict, read from this repository's own runs (D87).
# id-token: npm trusted publishing exchanges it for a one-time token, avoiding
# a stored npm secret.
permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Require every matrix lane to be green on this commit before publication
  # (D87).
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-verdict.mjs

  release:
    needs: verdict
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - name: Check the tag names the package version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error title=Release::tag ${GITHUB_REF_NAME} does not name package.json's version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # Fail before the dev publish if this version has no CHANGELOG section;
      # GitHub Release notes read the same file.
      - name: Check the version has its CHANGELOG section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/changelog.mjs --notes "${VERSION}" > /dev/null
      - run: npm ci
      # Reruns skip existing publications and dist output; npm rejects duplicate
      # versions.
      - name: Read what is already out
        id: state
        run: node scripts/release-state.mjs >> "$GITHUB_OUTPUT"
      # Pack release and dev from one build so both tarballs contain the tree
      # the matrix judged.
      - name: Pack the release and its dev version
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          paths="$(node scripts/release-pack.mjs --out .debug/release --dev "${VERSION}-dev.${GITHUB_RUN_NUMBER}")"
          echo "release=$(printf '%s\n' "${paths}" | sed -n 1p)" >> "$GITHUB_OUTPUT"
          echo "dev=$(printf '%s\n' "${paths}" | sed -n 2p)" >> "$GITHUB_OUTPUT"
      # Publish dev first for early trials; a later failure leaves latest
      # unpromoted.
      - name: Publish the dev version
        if: steps.state.outputs.published != 'true' && steps.state.outputs.dev == ''
        run: npm publish "${{ steps.pack.outputs.dev }}" --access public --provenance --tag dev
      # Recheck the tree being published; page results come from `verdict`.
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run changelog:check
      - run: npm run agents:check
      - run: npm run checks:numbers -- --check
      - run: npm run build
      # Build before writing npm's contents to dist because generated `lib/` is
      # absent from a fresh checkout (D47).
      - name: Write the dist branch and move the tag
        if: steps.state.outputs.packaged != 'true'
        run: node scripts/dist-branch.mjs --push
      - name: Publish to npm
        if: steps.state.outputs.published != 'true'
        env:
          RELEASE: ${{ steps.pack.outputs.release }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # npm refuses a prerelease without a dist-tag; it must not become latest.
          case "${VERSION}" in
            *-*) npm publish "${RELEASE}" --access public --provenance --tag next ;;
            *) npm publish "${RELEASE}" --access public --provenance ;;
          esac
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p .debug
          notes=.debug/release-notes.md
          node scripts/changelog.mjs --notes "${VERSION}" > "${notes}"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release edit "v${VERSION}" --notes-file "${notes}"
          else
            case "${VERSION}" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
            gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --notes-file "${notes}" ${prerelease}
          fi
