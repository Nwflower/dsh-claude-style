name: Release

# A release starts from a tag the maintainer pushes: the version's CHANGELOG
# section and the bumped package.json are already in that commit. What it stands
# on is the matrix already run against that commit — the manual CI run the
# release stretch starts before the version is cut (D87) — so this workflow reads
# that verdict rather than walking the same lanes a second time on the same tree.
# A tag whose commit carries no green matrix stops here, before anything is
# packed or published, and names the command that produces one.
#
# The rest is the packing and the two publications: the package is packed once
# and published as `<version>-dev.<run number>` under npm's `dev` tag so the
# version can be tried immediately, then the checks that read no page confirm the
# tree, and `<version>` goes out as `latest` from the same tarball. The same files
# npm gets are written to the `dist` branch so a git install needs no build
# (D47), and the GitHub Release opens with the version's CHANGELOG section. The
# promotion is the last step.

on:
  push:
    tags: ['v*']

# contents: the dist branch, the moved tag and the GitHub Release (D47).
# actions: the matrix verdict, read from this repository's own runs (D87).
# id-token: what npm's trusted publishing exchanges for a one-time publish
# token, so no npm secret is stored.
permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate the promotion stands on, read before the pack: `release-verdict.mjs`
  # finds the manual CI run on this commit and holds it to every lane the matrix
  # has. A release that fails here has published nothing.
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-verdict.mjs

  release:
    needs: verdict
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - name: Check the tag names the package version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error title=Release::tag ${GITHUB_REF_NAME} does not name package.json's version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # The GitHub Release shows this version's section, and the changelog gate
      # reads the same file: a tag cut without one fails here, before the dev
      # build goes out, rather than after `latest` sits on npm with nothing to say.
      - name: Check the version has its CHANGELOG section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/changelog.mjs --notes "${VERSION}" > /dev/null
      - run: npm ci
      # A rerun carries on from where the last attempt stopped: npm refuses a
      # version twice, the dev build of this tag is not published again, and a
      # tag already on the dist head means the branch went out.
      - name: Read what is already out
        id: state
        run: node scripts/release-state.mjs >> "$GITHUB_OUTPUT"
      # One build, two tarballs: the release the promotion publishes, and the
      # same files with the dev version in them that the `dev` tag gets now. The
      # tarballs carry the bundle this commit builds, which is the one the matrix
      # judged.
      - name: Pack the release and its dev version
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          paths="$(node scripts/release-pack.mjs --out .debug/release --dev "${VERSION}-dev.${GITHUB_RUN_NUMBER}")"
          echo "release=$(printf '%s\n' "${paths}" | sed -n 1p)" >> "$GITHUB_OUTPUT"
          echo "dev=$(printf '%s\n' "${paths}" | sed -n 2p)" >> "$GITHUB_OUTPUT"
      # Out at once, so the version can be installed and tried while the checks
      # below run; a check that fails leaves the dev build where it is and
      # promotes nothing.
      - name: Publish the dev version
        if: steps.state.outputs.published != 'true' && steps.state.outputs.dev == ''
        run: npm publish "${{ steps.pack.outputs.dev }}" --access public --provenance --tag dev
      # The checks that read no page, on the tree npm is about to receive: seconds
      # each, and the matrix that judged the pages is what the verdict job read.
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run changelog:check
      - run: npm run agents:check
      - run: npm run checks:numbers -- --check
      - run: npm run build
      # The dist branch carries the npm package's own contents, and the step
      # builds first: `lib/` is not in version control, so a fresh checkout has
      # none and packing alone would ship a `main` that is not in the package.
      - name: Write the dist branch and move the tag
        if: steps.state.outputs.packaged != 'true'
        run: node scripts/dist-branch.mjs --push
      - name: Publish to npm
        if: steps.state.outputs.published != 'true'
        env:
          RELEASE: ${{ steps.pack.outputs.release }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # npm refuses a prerelease without a dist-tag; it must not become latest.
          case "${VERSION}" in
            *-*) npm publish "${RELEASE}" --access public --provenance --tag next ;;
            *) npm publish "${RELEASE}" --access public --provenance ;;
          esac
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p .debug
          notes=.debug/release-notes.md
          node scripts/changelog.mjs --notes "${VERSION}" > "${notes}"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release edit "v${VERSION}" --notes-file "${notes}"
          else
            case "${VERSION}" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
            gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --notes-file "${notes}" ${prerelease}
          fi
