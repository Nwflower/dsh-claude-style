name: Release

# A release starts from a tag the maintainer pushes: the version's CHANGELOG
# section and the bumped package.json are already in that commit. The job packs
# the package once and publishes it as `<version>-dev.<run number>` under npm's
# `dev` tag so the version can be tried before the gates finish, runs the gates
# the fast tier holds, then the end-to-end lane, and only then publishes
# `<version>` as `latest` from the same tarball, writes the same files npm gets
# to the `dist` branch so a git install needs no build (D47), and opens the
# GitHub Release with the version's CHANGELOG section. The promotion is the last
# step: the gates above it are the ones CI's own jobs run (D86).

on:
  push:
    tags: ['v*']

# contents: the dist branch, the moved tag and the GitHub Release (D47).
# id-token: what npm's trusted publishing exchanges for a one-time publish
# token, so no npm secret is stored.
permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The readers' desktop runs on Windows, and the release carries the same
  # package to it: the smoke there is a gate the promotion waits on, as it is in
  # CI.
  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke

  release:
    needs: smoke-windows
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - name: Check the tag names the package version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error title=Release::tag ${GITHUB_REF_NAME} does not name package.json's version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # The GitHub Release shows this version's section, and the changelog gate
      # reads the same file: a tag cut without one fails here, before the dev
      # build goes out, rather than after `latest` sits on npm with nothing to say.
      - name: Check the version has its CHANGELOG section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/changelog.mjs --notes "${VERSION}" > /dev/null
      - run: npm ci
      # A rerun carries on from where the last attempt stopped: npm refuses a
      # version twice, the dev build of this tag is not published again, and a
      # tag already on the dist head means the branch went out.
      - name: Read what is already out
        id: state
        run: node scripts/release-state.mjs >> "$GITHUB_OUTPUT"
      # One build, two tarballs: the release the promotion publishes, and the
      # same files with the dev version in them that the `dev` tag gets now.
      - name: Pack the release and its dev version
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          paths="$(node scripts/release-pack.mjs --out .debug/release --dev "${VERSION}-dev.${GITHUB_RUN_NUMBER}")"
          echo "release=$(printf '%s\n' "${paths}" | sed -n 1p)" >> "$GITHUB_OUTPUT"
          echo "dev=$(printf '%s\n' "${paths}" | sed -n 2p)" >> "$GITHUB_OUTPUT"
      # Out before the gates, so the version can be installed while they run; a
      # gate that fails leaves the dev build where it is and promotes nothing.
      - name: Publish the dev version
        if: steps.state.outputs.published != 'true' && steps.state.outputs.dev == ''
        run: npm publish "${{ steps.pack.outputs.dev }}" --access public --provenance --tag dev
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run changelog:check
      - run: npm run agents:check
      - run: npm run checks:numbers -- --check
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      # The behaviour specs read the same build on the same stand-in host; a
      # release is judged by the layers CI runs, this one included (D86).
      - run: npm run behaviour
      # The assembled host on the newest published version, walked over the scenario
      # table's own default walk: what a pull request runs is what the promotion
      # waits on (D86). One scenario at a time, the way a pull request's shard
      # drives its own slice: the scenarios that read the page frame by frame —
      # the long session's frame cost among them — do not survive sharing this
      # runner with a second page, and the table walked several at once put the
      # worst frame past its bound on two runs of the same commit.
      - run: npm install --global pnpm@11 @deepseek-ai/dsh@$(node packages/testing/host-version.mjs)
      - run: node packages/testing/e2e.mjs --jobs 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-e2e-traces
          path: .debug/e2e/out
          if-no-files-found: ignore
      # The dist branch carries the npm package's own contents, and the step
      # builds first: `lib/` is not in version control, so a fresh checkout has
      # none and packing alone would ship a `main` that is not in the package.
      - name: Write the dist branch and move the tag
        if: steps.state.outputs.packaged != 'true'
        run: node scripts/dist-branch.mjs --push
      - name: Publish to npm
        if: steps.state.outputs.published != 'true'
        env:
          RELEASE: ${{ steps.pack.outputs.release }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # npm refuses a prerelease without a dist-tag; it must not become latest.
          case "${VERSION}" in
            *-*) npm publish "${RELEASE}" --access public --provenance --tag next ;;
            *) npm publish "${RELEASE}" --access public --provenance ;;
          esac
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p .debug
          notes=.debug/release-notes.md
          node scripts/changelog.mjs --notes "${VERSION}" > "${notes}"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release edit "v${VERSION}" --notes-file "${notes}"
          else
            case "${VERSION}" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
            gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --notes-file "${notes}" ${prerelease}
          fi
