name: CI

# Master pushes run checks and the lanes selected by the change (D87);
# feature-only pushes leave the remaining quick smoke and behaviour specs to
# Observe, outside the branch rule.
#
# Pull requests and merge queues run full smoke, Linux behaviour and e2e;
# manual runs add macOS for the release matrix. Tag pushes belong to Release.
#
# `scripts/ci-scope.mjs` supplies the feature selection and tree-keyed build
# cache; page lanes wait for checks and scope, then share one `lib/` artifact.
#
# Concurrency is per event and commit; merge-queue runs are never cancelled.
# `required` aggregates every job with `always()` because GitHub counts skipped
# jobs as passed.
on:
  push:
    branches: [master]
    # Data-only commits are validated by the Data workflow.
    paths-ignore:
      - 'packages/host/data/**'
  pull_request:
    paths-ignore:
      - 'packages/host/data/**'
  merge_group:
  workflow_dispatch:

concurrency:
  group: CI-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  # Diff against the event's merge base, excluding unrelated master changes.
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      selection: ${{ steps.scope.outputs.selection }}
      tree: ${{ steps.scope.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The token is not left in `.git/config` for the steps that follow.
          persist-credentials: false
          # The diff needs the base commit and, on a new branch, master's.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Install dependencies for esbuild to bundle the feature manifests (D42).
      - run: npm ci
      - id: scope
        run: node scripts/ci-scope.mjs --base "${{ github.event.pull_request.base.sha || github.event.before || 'origin/master' }}"
      # Reject snapshots moved without their sheets and ledgers that only
      # shrink (D87, D9).
      - run: node scripts/ci-scope.mjs --appearance --ledgers --base "${{ github.event.pull_request.base.sha || github.event.before || 'origin/master' }}"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run changelog:check
      - run: npm run agents:check
      - run: npm run checks:numbers -- --check

  # Build `lib/` once so every lane judges the same generated artifact (D47).
  build:
    needs: [changed, checks]
    if: needs.changed.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .debug/build-cache
          key: build-cache-${{ runner.os }}-${{ needs.changed.outputs.tree }}
      - run: npm run build
        timeout-minutes: 15
      - uses: actions/upload-artifact@v7
        with:
          name: lib
          path: lib
          if-no-files-found: error

  unit-smoke:
    needs: [changed, checks, build]
    if: needs.changed.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: lib
          path: lib
      - run: npm test
        timeout-minutes: 15
      # Call the scripts directly so npm does not consume the feature-selection
      # flag; an empty push selection means `--quick`.
      - run: node packages/testing/smoke.mjs ${{ needs.changed.outputs.selection }}
        if: github.event_name != 'push'
        timeout-minutes: 30
      - run: node packages/testing/smoke.mjs ${{ needs.changed.outputs.selection || '--quick' }}
        if: github.event_name == 'push'
        timeout-minutes: 30
      # Use the same build and stand-in host (D87); pushes run selected
      # features, other events run all.
      - run: node packages/testing/behaviour.mjs ${{ github.event_name == 'push' && needs.changed.outputs.selection || '' }}
        timeout-minutes: 15
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: behaviour-evidence-linux
          path: .debug/behaviour
          if-no-files-found: ignore

  # Windows exercises host filesystem behavior only; page behavior is covered
  # on Linux and macOS.
  smoke-windows:
    needs: [changed, checks, build]
    if: needs.changed.outputs.code == 'true' && github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: lib
          path: lib
      - run: node packages/testing/smoke.mjs --host
        timeout-minutes: 10

  # Release/nightly-only macOS behaviour catches font and Chrome overflow
  # without delaying pull request queues (D87).
  behaviour-macos:
    needs: [changed, checks, build]
    if: needs.changed.outputs.code == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: lib
          path: lib
      - run: npm run behaviour
        timeout-minutes: 15
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: behaviour-evidence-macos
          path: .debug/behaviour
          if-no-files-found: ignore

  # Test the assembled plugin against the newest published host (D87).
  e2e:
    needs: [changed, checks, build]
    if: needs.changed.outputs.code == 'true' && github.event_name != 'push'
    strategy:
      # Run all shards so one failure does not hide the others.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: lib
          path: lib
      # The host CLI needs pnpm to install profile plugins.
      - run: npm install --global pnpm@11 @deepseek-ai/dsh@$(node packages/testing/host-version.mjs)
        timeout-minutes: 10
      - run: node packages/testing/e2e.mjs --shard ${{ matrix.shard }}:4
        timeout-minutes: 25
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: .debug/e2e/out
          if-no-files-found: ignore

  required:
    if: always()
    needs: [changed, checks, build, unit-smoke, smoke-windows, behaviour-macos, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/ci-required.mjs '${{ toJson(needs) }}'
