name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gates that need no host: the build checks, the unit tests in a real
  # browser, the decisions index against the files it lists, and the smoke's
  # stand-in page plus the host half's routes.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run features:check
      - run: npm run docs:check
      - run: npm run changelog:check
      - run: npm run build
      - run: npm test
      - run: npm run smoke

  # The readers' desktop runs on Windows, and the host half reads session
  # directories, drive-letter paths and file times there (D45).
  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke

  # The assembled host: a scratch `dsh web` with this checkout's plugin and the
  # scripted model service, driven through a real conversation (D45).
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    # The lane boots a host per scenario and walks every one of them: nine of
    # the ten lay out a page and drive at least one turn, and `shots` captures
    # both palettes. A 30-minute cap cut the run off with `contract`, the last
    # scenario, still in flight, so the budget holds the whole lane and leaves
    # room for a slow runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The lane boots the host's own CLI, which needs pnpm to install a
      # profile's plugins.
      - run: npm install --global pnpm@11 @deepseek-ai/dsh@0.2.1-alpha.1
      - run: node packages/testing/e2e.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-traces
          path: .debug/e2e/out
          if-no-files-found: ignore

  # The host's newest prerelease against the contract the skin reads, ahead of
  # the pinned version above: a selector or entry that stopped holding shows up
  # here before the pin moves. Advisory, it holds no merge back (D45).
  contract-host-alpha:
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --global pnpm@11 @deepseek-ai/dsh@alpha
      - run: node packages/testing/e2e.cjs --scenario contract
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-traces-host-alpha
          path: .debug/e2e/out
          if-no-files-found: ignore
