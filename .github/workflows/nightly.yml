name: Nightly

# Check external drift daily: e2e tests the newest published host's contract
# and appearance (D86), while macOS behaviour covers platform fonts and Chrome.
#
# These jobs block neither merges nor releases; manual runs check the same
# lanes on a chosen commit. Build each tested tree because `lib/` is generated
# and not versioned (D47).
on:
  schedule:
    - cron: '41 16 * * *'
  workflow_dispatch:

concurrency:
  group: Nightly-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  behaviour-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        timeout-minutes: 15
      - run: npm run stand-in
        timeout-minutes: 15
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: nightly-behaviour-macos
          path: .debug/runs/behaviour
          if-no-files-found: ignore

  e2e-host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        timeout-minutes: 15
      # The host CLI needs pnpm to install profile plugins.
      - run: npm install --global pnpm@11 @deepseek-ai/dsh@$(node packages/testing/host-version.mjs)
        timeout-minutes: 10
      # Run all scenarios together so their traces share one artifact.
      - run: node packages/testing/e2e.mjs
        timeout-minutes: 35
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-e2e-traces
          path: .debug/runs/e2e/out
          if-no-files-found: ignore
