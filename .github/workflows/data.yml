name: Data

# Commit validated snapshots so installs do not scrape upstream. Refresh the
# catalog before prices because prices use its Chinese public holidays; CI
# ignores the resulting data-only commits.
on:
  schedule:
    # Daily, before Beijing's first peak window.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Host validators are bundled with esbuild; skip the test-only browser
      # download.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Refresh the peak rate catalog
        run: node scripts/fetch-peakrate-catalog.mjs
      - name: Refresh the price snapshot
        run: node scripts/fetch-prices.mjs
      - name: Commit a change
        run: |
          if git diff --quiet -- packages/host/data; then
            echo "the data is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host/data
          git commit -m "chore(data): refresh the price and peak rate snapshots"
          git push
