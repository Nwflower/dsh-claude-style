name: Faults

# Verify that each known defect still turns a spec red in a scratch tree (D92).
#
# Run weekly or manually because browser faults each need a build; failures
# mean the defect corpus or specs need updating.

on:
  schedule:
    # Mondays at 04:00 UTC, after weekly dependency updates.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  # Serialize runs because they write scratch copies under .debug/runs/faults.
  group: faults
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  faults:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run faults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: faults-report
          path: .debug/runs/faults/report-new.json
          if-no-files-found: ignore
