name: 建议 / Feature request
description: 提出新功能或改进 / Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先搜索**重复 issue**，并描述你遇到的场景与动机，而不只是结论。
        Thanks — search for **duplicates** first, and describe the scenario and motivation, not only the conclusion.
  - type: textarea
    id: motivation
    attributes:
      label: 场景与动机 / Problem and scenario
      description: 你在做什么、缺了什么、为什么需要 / What you were doing, what was missing, why it matters
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为 / Proposed behavior
      description: 你希望主题怎么做 / What you would like the theme to do
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 类别 / Area
      description: 新外观、配色、样式变体等需要拍板的界面方案选「界面设计与决策」；现有界面的交互、显示逻辑与设置项选「现有界面行为」 / Pick "UI design and decisions" for a new look, palette, style variant or other visual direction to settle; pick "Existing UI behavior" for how the current interface acts, displays or is configured
      options:
        - 界面设计与决策 / UI design and decisions
        - 现有界面行为 / Existing UI behavior
        - 功能 / Feature
        - 性能 / Performance
        - 文档 / Documentation
        - 其他 / Other
    validations:
      required: true
  - type: checkboxes
    id: pr
    attributes:
      label: 参与 / Contribution
      options:
        - label: 我愿意提交 PR 实现它 / I am willing to submit a PR for it
          required: false
  - type: textarea
    id: context
    attributes:
      label: 补充上下文 / Additional context
    validations:
      required: false
